<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masam — bağlantı yok</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f5f8;color:#15202b;font:16px/1.5 Aptos,"Segoe UI",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#0f161d;color:#e6ecf2}}
  main{text-align:center;padding:24px;max-width:380px}
  img{width:72px;height:72px;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 20px;opacity:.75}
  button{background:#0e7c6b;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Bağlantı yok</h1>
  <p>İnternete ulaşılamıyor. Bağlantın gelince Masam kaldığın yerden devam eder.</p>
  <button onclick="location.reload()">Tekrar dene</button>
</main>
</body>
</html>
